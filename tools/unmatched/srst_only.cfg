adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# ADBUS4 = FT_JTAG_SRST, ACTIVE HIGH through Q8B onto RESET_N (schematic sheet 16). OpenOCD's nSRST
# is active-low, so the polarity is inverted with -ndata. Idle keeps ADBUS4 low = not in reset.
ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -ndata 0x0010 -oe 0x0010
transport select jtag
adapter speed 8000
reset_config srst_only srst_push_pull
jtag newtap riscv cpu -irlen 5 -expected-id 0x20000913 -ignore-version
