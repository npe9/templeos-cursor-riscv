# SiFive HiFive Unmatched (FU740-C000) — OpenOCD interface + target.
#
# OpenOCD 0.12 ships no board config for the Unmatched (only hifive1 / E31-E51
# Arty), so this is the whole thing: adapter, TAP, targets, DDR-already-up
# assumption.
#
#
# Verify the probe sees the SoC before anything else:
#   openocd -f tests/openocd/hifive_unmatched.cfg -c "init; scan_chain; shutdown"
# A RISC-V TAP answers 0x20000913 (SiFive). If you get 0x4ba00477 that is an ARM
# CoreSight DAP — the probe is on a different board.

# WHAT THE SCHEMATIC SAYS (HiFive Unmatched schematics rev 3, sheets 4 and 16 — read 2026-09-26;
# everything the previous version of this header said about J18 was wrong):
#   * J18 is a 2-pin "JTAG MUX Sel" JUMPER, not a JTAG header. It drives JMUXSEL on U12, a TS3A5018
#     4-channel analog mux, through a 100K pull-down: "Place Jumper to select Connector for JTAG.
#     Default is FT2232." No jumper = the on-board FT2232H (micro-USB). Jumper = header J6.
#   * J6 is the external JTAG header: "Header 2x5", Cortex-10 arrangement — 1 VDD_1V8 (VTref),
#     2 NJTAG_TMS, 3 GND, 4 NJTAG_TCK, 5 GND, 6 NJTAG_TDO, 7 key, 8 NJTAG_TDI, 9 GND, 10 RESET_N.
#     THE FU740'S JTAG IS 1.8 V LOGIC. An Olimex ARM-USB-TINY-H is a 2.0-5.0 V probe: do NOT connect
#     it to J6. (ARM-USB-OCD-H goes to 1.65 V; OCD-HL to 0.65 V.)
#   * On-board path, sheet 16: FT2232HL ADBUS0-3 -> U4 TXB0104 (3.3<->1.8 V auto-direction shifter)
#     -> 33R series -> the mux -> FU740. That chain is the likely source of the measured 1-5%
#     per-scan error floor; a TXB into series R plus a mux is exactly where those parts get marginal.
#   * ADBUS4 = FT_JTAG_SRST, ACTIVE HIGH, through Q8B onto RESET_N. layout_init MUST keep bit 4 low
#     (0x0008 does). Driving it high resets the board — a 0x0038 experiment did exactly that.
#     ADBUS5-7 are not connected.
#   * Console: FT2232H channel B (BDBUS0/1) -> U5 TXS0102 -> UART0 at 1.8 V. Channel A is JTAG.
# => THIS CONFIG (Olimex ARM-USB-TINY-H) CANNOT BE USED ON THE UNMATCHED: 1.8 V target, 2.0 V probe.
#    Kept only as the template for a 1.8 V-capable probe on J6 with the J18 jumper fitted.

adapter driver ftdi
ftdi device_desc "Olimex OpenOCD JTAG ARM-USB-TINY-H"
ftdi vid_pid 0x15ba 0x002a
ftdi layout_init 0x0808 0x0a1b
ftdi layout_signal nSRST -oe 0x0200
ftdi layout_signal nTRST -data 0x0100 -oe 0x0100

transport select jtag
# 9 MHz with TDO sampled on the falling edge — the least-bad point measured through the on-board
# FT2232H (see hifive_unmatched_ft2232h.cfg for the table). Slower is NOT safer on the FU740: below
# 4 MHz DMI collapses entirely. Re-measure through the Olimex with the 300-scan floor probe before
# trusting it; the point of this probe is that it bypasses the on-board FTDI's JTAG traces.
adapter speed 9000
ftdi tdo_sample_edge falling

set _CHIPNAME riscv
# FU740 RISC-V debug TAP. -ignore-version so an A00 vs A01 stepping still matches;
# if the IDCODE differs, scan_chain prints the real one — put it here.
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x20000913 -ignore-version

# U74 application cores are hart 1..4; hart 0 is the S7 monitor core.
# ONE target: U74 hart 1, the takeover target. Fewer DMI ops per init = fewer chances to hit the floor.
target create $_CHIPNAME.hart1 riscv -chain-position $_CHIPNAME.cpu -coreid 1
targets $_CHIPNAME.hart1

# The kernel is loaded into DDR that U-Boot/OpenSBI already trained; this config
# deliberately does NOT reset the SoC, so a halt lands in whatever firmware left.
gdb_report_data_abort enable
