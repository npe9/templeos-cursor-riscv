# SiFive HiFive Unmatched (FU740-C000) — OpenOCD interface + target.
#
# OpenOCD 0.12 ships no board config for the Unmatched (only hifive1 / E31-E51
# Arty), so this is the whole thing: adapter, TAP, targets, DDR-already-up
# assumption.
#
# Wiring: the Unmatched's JTAG is the 2x6 0.05" header J18 ("FTDI/JTAG"), NOT
# the micro-USB — that is the CP2105 console only. An Olimex ARM-USB-TINY-H is
# the probe SiFive documents; it is a 2x10 0.1" ARM pinout, so it needs the
# adapter/flywires to reach J18. Keep TCK slow until the chain scans clean.
#
# Verify the probe sees the SoC before anything else:
#   openocd -f tests/openocd/hifive_unmatched.cfg -c "init; scan_chain; shutdown"
# A RISC-V TAP answers 0x20000913 (SiFive). If you get 0x4ba00477 that is an ARM
# CoreSight DAP — the probe is on a different board.

adapter driver ftdi
# FT2232H "Dual RS232-HS" generic breakout — this is what is wired to J18 on this bench (measured: scan_chain
# via it answers 0x20000913; the Olimex on this same host answers an ARM DAP, i.e. a different board).
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# The board enumerates with NO USB serial number (macOS names it by location: usbserial-1100/1101).
# If a second FT2232H is ever attached, pin this one by bus-port from `ioreg -p IOUSB -l | grep
# locationID` (0x01100000 -> "1-1"). Left UNPINNED by default: the location changes when the cable
# moves between ports or through a dock, and a stale pin is a silent "no device found".
# adapter usb location 1-1
ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
# ADBUS4+ADBUS5 driven HIGH: if the breakout routes nTRST/nSRST there, this DEASSERTS them.
# Symptom this tests: IDCODE scans clean (works from Test-Logic-Reset) but IR capture reads
# all-ones and dtmcontrol is 0/0xffffffff — a TAP held in reset, not a slow clock.

transport select jtag
# 10 MHz with TDO sampled on the FALLING edge, and NOT slower — measured on the board, 2026-09-26,
# 60 alternating dmstatus/abstractcs reads per held session:
#     3 MHz  OpenOCD aborted (assert riscv-013.c:499 on a corrupt dtmcontrol)
#     4 MHz  1 error, 7 distinct values (a corrupted hartsel read back "hart nonexistent")
#   5-8 MHz  0 errors, 1-2 stray values
#    10 MHz  0 errors, 1 stray value          + tdo_sample_edge falling: 0 errors, NONE stray
#   1-2 MHz  0/30 reads parsed at all; 100 kHz 6/24 IDCODE scans
# "Start slow until the chain scans clean" is the wrong instinct for this FT2232H+FU740 pair.
adapter speed 10000
ftdi tdo_sample_edge falling

set _CHIPNAME riscv
# FU740 RISC-V debug TAP. -ignore-version so an A00 vs A01 stepping still matches;
# if the IDCODE differs, scan_chain prints the real one — put it here.
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x20000913 -ignore-version

# U74 application cores are hart 1..4; hart 0 is the S7 monitor core.
target create $_CHIPNAME.hart1 riscv -chain-position $_CHIPNAME.cpu -coreid 1
target create $_CHIPNAME.hart2 riscv -chain-position $_CHIPNAME.cpu -coreid 2
target create $_CHIPNAME.hart3 riscv -chain-position $_CHIPNAME.cpu -coreid 3
target create $_CHIPNAME.hart4 riscv -chain-position $_CHIPNAME.cpu -coreid 4
targets $_CHIPNAME.hart1

# The kernel is loaded into DDR that U-Boot/OpenSBI already trained; this config
# deliberately does NOT reset the SoC, so a halt lands in whatever firmware left.
gdb_report_data_abort enable
