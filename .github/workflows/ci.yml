# Jobs: syntax-sh | shellcheck | compile-compliance (parallel) → qemu-integration.
# Mirrors local: `make compliance` + `make fmt-test` + `make fmt-check` + `asm-stress` +
# `asm-prop`, then `make qemu-integration` (or `make ci`). See docs/CI.md and tests/README.md.
# Markdown-only pushes skip via paths-ignore; force a full run with
# Actions → CI → Run workflow.
name: CI

on:
  push:
    branches: [archive, main, master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [archive, main, master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  syntax-sh:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: bash -n on all tests/scripts/*.sh
        run: make syntax-sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 shellcheck

      - name: Lint Makefile/CI shell scripts
        run: |
          set -euo pipefail
          for f in \
            tests/scripts/run_holyc_compliance.sh \
            tests/scripts/run_exec_oracles.sh \
            tests/scripts/run_templeos_smoke.sh \
            tests/scripts/run_repl_smoke.sh \
            tests/scripts/run_repl_regression.sh \
            tests/scripts/run_fmt_test.sh \
            tests/scripts/run_fmt.sh \
            tests/scripts/holyc_fmt_paths.sh \
            tests/scripts/gen_compliance_candidates.sh \
            tests/scripts/run_asm_stress.sh \
            tests/scripts/run_asm_gnu_diff.sh \
            tests/scripts/run_compiler_stress.sh; do
            shellcheck -S error -x "$f"
          done

  compile-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install host build tools
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 build-essential

      - name: Build holyc-riscv
        run: make

      - name: Compile-only compliance (TempleOS + parity)
        run: make compliance

      - name: Formatter golden tests
        run: make fmt-test

      - name: HolyC fmt-check (enforced roots)
        run: make fmt-check

      - name: Assembler semantics stress (goldens; gas optional)
        run: make asm-stress

      - name: Assembler property tests (RV64I oracle)
        run: make asm-prop

      - name: Assembler GNU differential (immediates/pseudos; gas optional)
        run: make asm-gnu-diff

  qemu-integration:
    runs-on: ubuntu-24.04
    needs: [compile-compliance, shellcheck, syntax-sh]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install RISC-V toolchain, QEMU, Python
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf \
            qemu-system-riscv64 \
            python3

      - name: qemu-integration (asm+compiler stress/prop, oracles, templeos + kernel smokes, plat-virt, phase3, hc-repl, REPL, term-probe)
        run: make && make qemu-integration
