# Mirrors local: `make compliance` then `make qemu-integration` (or `make ci` for both).
# Host HolyC→RISC-V compiler: compile compliance, then one QEMU job (oracles + OS smoke).
name: CI

on:
  push:
    branches: [archive, main, master]
  pull_request:
    branches: [archive, main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build holyc-riscv
        run: make

      - name: Compile-only compliance (TempleOS + parity)
        run: make compliance

  qemu-integration:
    runs-on: ubuntu-24.04
    needs: compile-compliance
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain, QEMU, Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf \
            qemu-system-riscv64 \
            python3

      - name: Exec oracles + TempleOS/RISC-V smoke (matches make qemu-integration)
        run: make && make qemu-integration
