# Jobs: syntax-sh | shellcheck | compile-compliance (parallel) → qemu-integration.
# Mirrors local: `make compliance` then `make qemu-integration` (or `make ci` for both).
# Host HolyC→RISC-V compiler: compile compliance, then one QEMU job (oracles + OS smoke + REPL smoke).
name: CI

on:
  push:
    branches: [archive, main, master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  pull_request:
    branches: [archive, main, master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  syntax-sh:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - name: bash -n on all tests/scripts/*.sh
        run: make syntax-sh

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 shellcheck

      - name: Lint Makefile/CI shell scripts
        run: |
          set -euo pipefail
          for f in \
            tests/scripts/run_holyc_compliance.sh \
            tests/scripts/run_exec_oracles.sh \
            tests/scripts/run_templeos_smoke.sh \
            tests/scripts/run_repl_smoke.sh \
            tests/scripts/gen_compliance_candidates.sh; do
            shellcheck -S error -x "$f"
          done

  compile-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install host build tools
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 build-essential

      - name: Build holyc-riscv
        run: make

      - name: Compile-only compliance (TempleOS + parity)
        run: make compliance

  qemu-integration:
    runs-on: ubuntu-24.04
    needs: [compile-compliance, shellcheck, syntax-sh]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install RISC-V toolchain, QEMU, Python
        run: |
          sudo apt-get update -y -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf \
            qemu-system-riscv64 \
            python3

      - name: Exec oracles + TempleOS/RISC-V smoke + kernel-print + kernel-puts + kernel-boot + kernel-calc + kernel-sched + kernel-timer + kernel-preempt + kernel-crit + REPL smoke (matches make qemu-integration)
        run: make && make qemu-integration
